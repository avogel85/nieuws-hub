# Browser tests: starts the dashboard with several test configurations and runs the Playwright + axe
# suites in tests/e2e (layout, accessibility, languages, phone views, hostile feeds, ...). The servers
# fetch the real feeds, so a suite that fails is retried once; screenshots and logs are kept on failure.
name: E2E
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble # same version as tests/e2e/package.json
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: npm ci
        working-directory: tests/e2e
        run: npm ci --no-audit --no-fund
      - name: Browser tests
        working-directory: tests/e2e
        env:
          E2E_WORK: ${{ runner.temp }}/e2e
          E2E_OUT: ${{ runner.temp }}/e2e-shots
        run: ./run.sh
      - name: Keep logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/e2e/logs
            ${{ runner.temp }}/e2e-shots
          retention-days: 7
