# For every release tag (v1.2.3), in this order:
#   1. image:   publishes ghcr.io/digibaro/news-dashboard-docker:1.2.3, :1.2, :1 and :latest (linux/amd64, linux/arm64).
#               The Dockerfile runs go vet and the unit tests, so a failing test stops everything.
#   2. release: builds the Linux downloads and SHA256SUMS, takes the notes from the "### 1.2.3" entry
#               in the README changelog, adds the install/update section, and publishes the GitHub release.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the VERSION file
        run: |
          v="$(tr -d ' \n' < VERSION)"
          [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "tag $GITHUB_REF_NAME does not match VERSION $v"; exit 1; }
      - name: README must have a changelog entry for this version
        run: grep -qx "### ${GITHUB_REF_NAME#v}" README.md || { echo "no '### ${GITHUB_REF_NAME#v}' in README.md"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=true
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the downloads
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            d="$(mktemp -d)"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=$v" -o "$d/nieuwsdashboard" .
            cp config.yaml.default LICENSE README.md "$d/"
            tar -czf "dist/nieuwsdashboard-$v-linux-$arch.tar.gz" -C "$d" .
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS)
      - name: Release notes from the changelog
        run: sh .github/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md && cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Nieuws Hub $v" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Nieuws Hub $v" --notes-file notes.md dist/*
          fi
